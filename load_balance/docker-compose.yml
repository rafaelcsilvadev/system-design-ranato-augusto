services:
  server-a:
    build: ./server-a
    # descomente para acessar direto, sem passar pelo balanceador
    # ports: ["3001:3001"]

  server-b:
    build: ./server-b
    # ports: ["3002:3002"]

  server-c:
    build: ./server-c
    # ports: ["3003:3003"]

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server-a
      - server-b
      - server-c
