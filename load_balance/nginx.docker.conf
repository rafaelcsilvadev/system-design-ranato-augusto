# Usado pelo docker-compose. Igual ao nginx.conf, mudando apenas
# 127.0.0.1 pelos nomes dos servicos da rede do compose.

events {}

http {
  upstream backend {
    server server-a:3001 weight=3;
    server server-b:3002;
    server server-c:3003;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://backend;
    }
  }
}
